version: '3.8'

services:
  deploy-be-01-docker:
    image: azure-agent-linux:latest
    environment:
      - AZP_URL=https://dev.azure.com/krossk
      - AZP_AGENT_NAME=deploy-be-01-docker
      - AZP_POOL=Deploy BE
      - KUBECONFIG=/opt/Agents/deploy-be-01-docker/kubeconfig
      - DEVEXTREME_KEY=${DEVEXTREME_KEY}
      - AzurePS=3.0.1
    volumes:
      #- /opt/Agents/deploy-be-01-docker:/opt/Agents/deploy-be-01-docker # Ak by sme potrebovali uchovavat workspaces aj po ukonceni kontajneru.
      - /opt/Agents/cache:/opt/Agents/cache
    secrets:
      - azure_pat_token
    deploy:
      restart_policy:
        condition: any

