apiVersion: v1
kind: ConfigMap
metadata:
  name: build-agent-config
data:
  AZURE_DEVOPS_URL: "https://dev.azure.com/kros-sk"
  AGENT_POOL_NAME: "build-be"  # Toto sa bude meniť pre každý pool
---
apiVersion: v1
kind: Secret
metadata:
  name: azure-pat-token
type: Opaque
data:
  AZURE_PAT_TOKEN: ${AZURE_PAT_TOKEN_BASE64}  # Treba zakódovať PAT token do base64
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: build-agent-pool
  labels:
    app: build-agent
    pool: build-be
spec:
  replicas: 2  # Počiatočný počet agentov
  selector:
    matchLabels:
      app: build-agent
      pool: build-be
  template:
    metadata:
      labels:
        app: build-agent
        pool: build-be
    spec:
      containers:
      - name: build-agent
        image: azure-agent-linux:latest
        envFrom:
        - configMapRef:
            name: build-agent-config
        - secretRef:
            name: azure-pat-token
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "1000m"
            memory: "2Gi"
        volumeMounts:
        - name: agent-cache
          mountPath: /opt/Agents/cache
      volumes:
      - name: agent-cache
        persistentVolumeClaim:
          claimName: agent-cache-pvc
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: build-agent-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: build-agent-pool
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agent-cache-pvc
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 50Gi
  storageClassName: standard  # Upravte podľa vašej storage class 