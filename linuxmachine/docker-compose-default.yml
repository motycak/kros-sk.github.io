version: '3.8'

services:
  default-01-docker:
    image: azure-agent-linux:latest
    environment:
      - AZP_URL=https://dev.azure.com/krossk
      - AZP_AGENT_NAME=default-01-docker
      - AZP_POOL=Default
      - KUBECONFIG=/opt/Agents/default-01-docker/kubeconfig
      - DEVEXTREME_KEY=${DEVEXTREME_KEY}
      - AzurePS=3.0.1
    volumes:
      #- /opt/Agents/default-01-docker:/opt/Agents/default-01-docker # Ak by sme potrebovali uchovavat workspaces aj po ukonceni kontajneru.
      - /opt/Agents/cache:/opt/Agents/cache
    secrets:
      - azure_pat_token
    deploy:
      restart_policy:
        condition: any
  
