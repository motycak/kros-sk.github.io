version: '3.8'

services:
  agent1:
    image: azure-agent-linux:latest
    environment:
      - AZP_URL=https://dev.azure.com/krossk
      - AZP_AGENT_NAME=docker-01-build4
      - AZP_POOL=Testing linux docker
      - KUBECONFIG=/opt/Agents/docker-01-build4/kubeconfig
      - DEVEXTREME_KEY=${DEVEXTREME_KEY}
      - azureps=true
    volumes:
      # - /opt/Agents/docker-01-build4:/opt/Agents/docker-01-build4 # Ak by sme potrebovali uchovavat workspaces aj po ukonceni kontajneru.
      - /opt/Agents/cache:/opt/Agents/cache
    secrets:
      - azure_pat_token
    deploy:
      restart_policy:
        condition: any

