version: '3.8'

services:
  Agents:
    image: azure-agent-linux:latest
    environment:
      - AZP_URL=https://dev.azure.com/krossk
      - AZP_AGENT_NAME=docker-${NODE_ID}-build4
      - AZP_POOL=Testing linux docker
      - DEVEXTREME_KEY=${DEVEXTREME_KEY}
      - AzurePS=3.0.1
    volumes:
      # - /opt/Agents/docker-${NODE_ID}-build4:/opt/Agents/docker-${NODE_ID}-build4 # Ak by sme potrebovali uchovavat workspaces aj po ukonceni kontajneru.
      - /opt/Agents/cache:/opt/Agents/cache
    secrets:
      - azure_pat_token
    deploy:
      replicas: 3
      restart_policy:
        condition: any

secrets:
  azure_pat_token:
    external: true 
